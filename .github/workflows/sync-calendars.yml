name: Sync calendars

# Triggers the production /api/cron/sync-calendars endpoint on a schedule.
# We do this from GitHub Actions because Vercel Hobby crons are limited to
# once per day. GitHub's scheduler is best-effort and can slip 5-15 minutes
# under load, so treat the cadence as approximate.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-calendars
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hit sync endpoint
        env:
          SYNC_URL: ${{ secrets.CALENDAR_SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SYNC_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing CALENDAR_SYNC_URL or CRON_SECRET secret"
            exit 1
          fi

          response=$(curl -sS --max-time 90 -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SYNC_URL")
          status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')

          echo "Status: $status"
          echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::Sync endpoint returned $status"
            exit 1
          fi
