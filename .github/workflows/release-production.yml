name: Release ChuppaCal to production

on:
  workflow_dispatch:
    inputs:
      apply_screensaver_migration:
        description: Apply migration 010 if the screensaver bucket is missing
        type: boolean
        default: false
      apply_recipe_migration:
        description: Apply migration 011 if the recipe bank is missing
        type: boolean
        default: false
      apply_recipe_instructions:
        description: Apply migration 012 if recipe instructions are missing
        type: boolean
        default: false
      apply_recipe_html:
        description: Apply migration 013 if HTML instructions are missing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chuppacal-production-release
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'samoeba/ChuppaCal' && github.ref == 'refs/heads/codex/recipe-html-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Test migrations with an isolated PostgreSQL database
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql postgresql-client
          node scripts/test-database.mjs

  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: Production
      url: https://chuppa-cal.vercel.app
    env:
      VERCEL_ORG_ID: team_8rzkv0B4ApQ7Eq8CufTf3Rrg
      VERCEL_PROJECT_ID: prj_6s1kdoVuN78E0FEu6YvTldISIT4E
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          APPLY_SCREENSAVER_MIGRATION: ${{ inputs.apply_screensaver_migration }}
          APPLY_RECIPE_HTML: ${{ inputs.apply_recipe_html }}
          APPLY_RECIPE_INSTRUCTIONS: ${{ inputs.apply_recipe_instructions }}
          APPLY_RECIPE_MIGRATION: ${{ inputs.apply_recipe_migration }}
        run: node scripts/release-database-migrations.mjs
