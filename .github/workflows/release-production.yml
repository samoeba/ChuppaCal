name: Release ChuppaCal to production

on:
  push:
    branches: [release/screensaver-010]
  workflow_dispatch:
    inputs:
      apply_screensaver_migration:
        description: Apply migration 010 if the screensaver bucket is missing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chuppacal-production-release
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'samoeba/ChuppaCal' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/screensaver-010')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Test migrations with an isolated PostgreSQL database
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql postgresql-client
          node scripts/test-database.mjs

  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: Production
      url: https://chuppa-cal.vercel.app
    env:
      VERCEL_ORG_ID: team_8rzkv0B4ApQ7Eq8CufTf3Rrg
      VERCEL_PROJECT_ID: prj_6s1kdoVuN78E0FEu6YvTldISIT4E
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install --prefix "$RUNNER_TEMP/chuppacal-vercel" vercel@65.16.0
      - name: Stage Vercel production build
        id: stage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_TOKEN:?Missing Production secret VERCEL_TOKEN}"
          deployment=$("$RUNNER_TEMP/chuppacal-vercel/node_modules/.bin/vercel" deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN")
          [[ "$deployment" =~ ^https://[a-zA-Z0-9-]+\.vercel\.app$ ]]
          echo "url=$deployment" >> "$GITHUB_OUTPUT"
      - name: Apply and verify Supabase migration 010
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          APPLY_SCREENSAVER_MIGRATION: ${{ github.event_name == 'push' || inputs.apply_screensaver_migration }}
        run: node scripts/release-screensaver-migration.mjs
      - name: Promote staged deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          "$RUNNER_TEMP/chuppacal-vercel/node_modules/.bin/vercel" promote "$DEPLOYMENT_URL" --yes --token "$VERCEL_TOKEN"
      - name: Confirm the production login and protected photo route
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors https://chuppa-cal.vercel.app/login --output /dev/null
          response=$(curl --silent --show-error --output /dev/null --write-out '%{http_code} %{redirect_url}' https://chuppa-cal.vercel.app/api/screensaver/photos/00000000-0000-0000-0000-000000000000)
          [[ "$response" == '307 https://chuppa-cal.vercel.app/login' || "$response" == '401 ' ]]
